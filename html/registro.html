<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Senabella</title>
  <!-- Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Hoja de Estilos -->
  <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

  <!-- Botón regresar al inicio -->
  <a href="inicio.html" class="boton-regresar" title="Volver al inicio">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Inicio</span>
  </a>

  <!-- Contenedor del formulario -->
  <main class="contenedor-registro">
    <div class="tarjeta-registro">
      <h2>Crea tu cuenta</h2>
      <p class="subtitulo">Ingresa tus datos para comprar en Senabella</p>

      <form id="formularioRegistro" class="formulario" novalidate>

        <!-- Campo Nombre -->
        <div class="grupo-campo">
          <label for="nombreCompleto">Nombre completo</label>
          <div class="campo-wrapper">
            <input type="text" id="nombreCompleto" placeholder="Ej. Ana García" maxlength="32" required>
            <i class="fa-solid fa-user icono-campo"></i>
          </div>
        </div>

        <!-- Campo Correo -->
        <div class="grupo-campo">
          <label for="correoElectronico">Correo electrónico</label>
          <div class="campo-wrapper">
            <input type="email" id="correoElectronico" placeholder="nombre@ejemplo.com" maxlength="32" required>
            <i class="fa-solid fa-envelope icono-campo"></i>
          </div>
        </div>

        <!-- Campo Celular -->
        <div class="grupo-campo">
          <label for="celular">Número de celular</label>
          <div class="campo-wrapper">
            <input type="tel" id="celular" placeholder="Ej. 300 123 4567" maxlength="12" minlength="7" inputmode="numeric" autocomplete="tel" required>
            <i class="fa-solid fa-phone icono-campo"></i>
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="grupo-campo">
          <label for="contrasena">Contraseña</label>
          <div class="campo-wrapper">
            <input type="password" id="contrasena" class="has-toggle" placeholder="Mínimo 8 caracteres" maxlength="32" required>
            <i class="fa-solid fa-lock icono-campo"></i>
            <button type="button" class="btn-toggle-pass" data-target="contrasena" title="Ver / Ocultar contraseña">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <!-- Medidor de fortaleza -->
          <div class="fortaleza-contenedor">
            <div class="fortaleza-barra">
              <div id="fortalezaProgreso" class="fortaleza-progreso"></div>
            </div>
            <span id="fortalezaTexto" class="fortaleza-texto">Ingresa una contraseña</span>
          </div>
        </div>

        <!-- Campo Confirmar Contraseña -->
        <div class="grupo-campo">
          <label for="confirmarContrasena">Confirmar contraseña</label>
          <div class="campo-wrapper">
            <input type="password" id="confirmarContrasena" class="has-toggle" placeholder="Repite tu contraseña" maxlength="32" required>
            <i class="fa-solid fa-shield-halved icono-campo"></i>
            <button type="button" class="btn-toggle-pass" data-target="confirmarContrasena"
              title="Ver / Ocultar contraseña">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <span id="coincidenciaTexto" class="coincidencia-texto"></span>
        </div>

        <!-- Alertas de estado -->
        <div id="mensajeError" class="mensaje-error"></div>
        <div id="mensajeExito" class="mensaje-exito"></div>

        <!-- Botón Enviar -->
        <button type="submit" class="boton-registro">
          <i class="fa-solid fa-user-plus"></i> Registrarme
        </button>
      </form>

      <div class="pie-tarjeta">
        <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </div>
  </main>

  <!-- Módulo de usuarios (debe ir ANTES de registro.js) -->
  <script src="../js/usuarios-bd.js"></script>
  <script src="../js/registro.js"></script>
</body>

</html>
