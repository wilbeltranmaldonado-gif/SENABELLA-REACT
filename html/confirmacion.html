<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmación de Pedido | Senabella</title>

  <!-- Iconos de font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <!-- Hojas de estilos -->
  <link rel="stylesheet" href="../css/encabezado.css" />
  <link rel="stylesheet" href="../css/confirmacion.css" />
</head>
<body>

  <!-- Header importado dinámicamente por JS (opcional si se requiere) -->
  <div id="header-container"></div>

  <!-- Contenedor Principal -->
  <main class="contenedor-confirmacion">
    
    <div class="tarjeta-confirmacion">
      
      <div class="icono-exito-wrapper">
        <i class="fa-solid fa-check"></i>
      </div>

      <h1 class="titulo-confirmacion">¡Gracias por tu compra!</h1>
      <p class="subtitulo-confirmacion">Tu pedido ha sido confirmado y ya estamos procesándolo.</p>

      <div class="resumen-pedido-box">
        <h3>Detalles de tu Orden</h3>
        <div class="detalle-grid">
          
          <div class="detalle-item">
            <span class="label">Número de Orden</span>
            <span class="valor" id="conf-orden">Cargando...</span>
          </div>
          
          <div class="detalle-item">
            <span class="label">Fecha de Compra</span>
            <span class="valor" id="conf-fecha">Cargando...</span>
          </div>

          <div class="detalle-item">
            <span class="label">Método de Pago</span>
            <span class="valor" id="conf-metodo" style="text-transform: capitalize;">Cargando...</span>
          </div>

          <div class="detalle-item total">
            <span class="label">Total Pagado</span>
            <span class="valor" id="conf-total">Cargando...</span>
          </div>
          
          <div class="detalle-item" style="grid-column: 1 / -1; margin-top: 10px;">
            <span class="label">Dirección de Envío</span>
            <span class="valor" id="conf-direccion">Cargando...</span>
          </div>

        </div>
      </div>

      <div class="acciones-confirmacion">
        <a href="inicio.html" class="btn-volver-inicio">Volver al Inicio</a>
        <a href="usuario.html" class="btn-ver-mis-compras">Ver mis compras</a>
      </div>

    </div>

  </main>

  <script src="../js/encabezado.js"></script>
  <script src="../js/confirmacion.js"></script>
</body>
</html>
